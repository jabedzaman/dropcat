name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: macos-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Build
        run: |
          brew install xcodegen
          xcodegen generate
          # CFBundleShortVersionString must be numeric: strip "v" and any "-beta.N" suffix.
          VERSION="${TAG#v}"; VERSION="${VERSION%%-*}"
          xcodebuild -project SSHDrop.xcodeproj -scheme SSHDrop -configuration Release \
            -destination 'platform=macOS' -derivedDataPath build \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO build
      - name: Package
        run: |
          ditto -c -k --keepParent build/Build/Products/Release/SSHDrop.app "SSHDrop-${TAG}.zip"
      - name: Upload to release
        run: gh release upload "$TAG" "SSHDrop-${TAG}.zip" --clobber
