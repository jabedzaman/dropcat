name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test core package
        run: swift test
      - name: Build app
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project SSHDrop.xcodeproj -scheme SSHDrop -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build
